name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/London

jobs:
  architecture-contracts:
    name: Architecture & contracts
    runs-on: ubuntu-24.04
    env:
      LLT_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      LLT_RELEASE_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact event SHA with ephemeral read-only credentials
        shell: bash
        env:
          LLT_CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          [[ "$GITHUB_SERVER_URL" == https://github.com ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          : "${LLT_CHECKOUT_TOKEN:?Read-only repository token is required}"
          [[ ! -e "$GITHUB_WORKSPACE/.git" ]]
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config core.hooksPath /dev/null
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          authorization=$(printf 'x-access-token:%s' "$LLT_CHECKOUT_TOKEN" | base64 -w 0)
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= fetch --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$GITHUB_SHA"
          unset authorization LLT_CHECKOUT_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach "$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Install checksum-verified Node 24.22.1 without JavaScript actions
        uses: ./.github/actions/verified-node
        with:
          node-version: '24.22.1'

      - name: Verify Node certificate-security baseline
        run: node scripts/security/nodeRuntimeTrust.js

      - run: npm ci
      - run: node scripts/release/checkCliVersions.js
      - run: npm run release:compatibility:check -- --base=${{ env.LLT_RELEASE_BASE_SHA }} --head=${{ env.LLT_RELEASE_HEAD_SHA }}
      - run: npm run release:config:check
      - run: npm run test:release
      - run: npm --prefix functions ci
      - run: npm --prefix web-admin ci
      - run: npm run efficiency:check
      - run: npm run contracts:check
      - run: npm run architecture:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:architecture

