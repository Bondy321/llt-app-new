name: EAS Build

on:
  workflow_dispatch:
    inputs:
      prerequisites_verified:
        description: I verified deployed backend and rules, real App Check providers/configuration, and acceptance for this exact reviewed commit
        required: true
        default: false
        type: boolean
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android

concurrency:
  group: eas-build-production-${{ github.event.inputs.platform }}
  cancel-in-progress: false

env:
  TZ: Europe/London

jobs:
  build-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prerequisites_verified == true }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      CI: true
      EAS_BUILD_PROFILE: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_SUPPORT_PHONE: '+441414876737'
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_URL: ${{ secrets.EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_URL }}
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_TIMEOUT_MS: ${{ secrets.EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_TIMEOUT_MS }}
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_USE_APPCHECK: 'true'
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_REQUIRE_APPCHECK: 'true'
      LLT_REQUIRE_PRODUCTION_APPCHECK: 'true'
      EXPO_PUBLIC_PASSENGER_TRIP_ENABLED: 'true'
      LLT_VALIDATE_PLATFORM: ${{ github.event.inputs.platform }}

    steps:
      - name: Checkout exact event SHA with ephemeral read-only credentials
        shell: bash
        env:
          LLT_CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          [[ "$GITHUB_SERVER_URL" == https://github.com ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          : "${LLT_CHECKOUT_TOKEN:?Read-only repository token is required}"
          [[ ! -e "$GITHUB_WORKSPACE/.git" ]]
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config core.hooksPath /dev/null
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          authorization=$(printf 'x-access-token:%s' "$LLT_CHECKOUT_TOKEN" | base64 -w 0)
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= fetch --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$GITHUB_SHA"
          unset authorization LLT_CHECKOUT_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach "$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Verify build commit is on main
        shell: bash
        env:
          LLT_CHECKOUT_TOKEN: ${{ github.token }}
        run: bash .github/actions/verified-node/verify-main.sh

      - name: Install checksum-verified Node 24.22.1 without JavaScript actions
        uses: ./.github/actions/verified-node
        with:
          node-version: '24.22.1'

      - name: Verify Node certificate-security baseline
        run: node scripts/security/nodeRuntimeTrust.js

      - name: Require successful CI for exact build SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verifyCiRunForSha.js --sha=${{ github.sha }}

      - name: Select and verify runner Java 21 without JavaScript actions
        uses: ./.github/actions/runner-java21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Install web admin dependencies for integration tests
        run: npm --prefix web-admin ci

      - name: Audit production dependency graphs
        run: npm run security:audit:release

      - name: Run mobile smoke tests
        run: npm run test:mobile:ota

      - name: Run Functions script tests
        run: npm run test:functions:scripts

      - name: Run Firebase rules tests
        run: npm run test:emulators

      - name: Validate Expo public environment
        run: npm run validate:expo-env -- --platform=${{ github.event.inputs.platform }}

      - name: Setup Expo and EAS CLI
        run: npm install --global eas-cli@22.6.0

      - name: Verify pinned release CLIs
        run: node scripts/release/checkCliVersions.js --check-eas

      - name: Sync EAS production environment
        run: npm run sync:eas-env:production -- --platform=${{ github.event.inputs.platform }}

      - name: Log build context
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub sha: ${{ github.sha }}"
          node -e "const app=require('./app.config.js').expo; console.log('Expo app version:', app.version)"
          eas whoami
          eas project:info --non-interactive

      - name: Verify EAS remote app version state
        run: eas build:version:get --platform ${{ github.event.inputs.platform }} --profile production --non-interactive

      - name: Build production binary
        run: eas build --profile production --platform ${{ github.event.inputs.platform }} --non-interactive
