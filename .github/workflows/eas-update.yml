name: EAS Update — TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-update-testflight
  cancel-in-progress: true

jobs:
  plan-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout repository at triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Plan automatic TestFlight OTA
        id: plan
        env:
          LLT_RELEASE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/release/planEasUpdate.js --event=${{ github.event_name }} --base=${{ env.LLT_RELEASE_BASE_SHA }} --head=${{ github.sha }} --github-output=$GITHUB_OUTPUT

  publish-testflight-update:
    needs: plan-update
    if: ${{ needs.plan-update.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      CI: true
      EAS_BUILD_PROFILE: testflight
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      EXPO_PUBLIC_SUPPORT_PHONE: '+441414876737'
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_URL: ${{ secrets.EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_URL }}
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_TIMEOUT_MS: ${{ secrets.EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_TIMEOUT_MS }}
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_USE_APPCHECK: 'false'
      EXPO_PUBLIC_VERIFY_PASSENGER_LOGIN_REQUIRE_APPCHECK: 'false'
      LLT_REQUIRE_PRODUCTION_APPCHECK: 'false'
      EXPO_PUBLIC_DRIVER_TOUR_PACK_TESTFLIGHT: 'true'
      LLT_VALIDATE_PLATFORM: ios

    steps:
      - name: Checkout repository at triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor ${{ github.sha }} origin/main

      - name: Require successful CI for exact release SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verifyCiRunForSha.js --sha=${{ github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency graphs
        run: npm run security:audit:release

      - name: Validate Expo public environment
        run: npm run validate:expo-env -- --platform=ios

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 22.6.0
          packager: npm
          token: ${{ env.EXPO_TOKEN }}

      - name: Verify pinned release CLIs
        run: node scripts/release/checkCliVersions.js --check-eas

      - name: Sync EAS production environment
        run: npm run sync:eas-env:production -- --platform=ios

      - name: Log release context
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub sha: ${{ github.sha }}"
          node -e "const pkg=require('./package.json'); console.log('App version:', pkg.version)"
          eas whoami
          eas project:info --non-interactive

      - name: Publish TestFlight channel update
        run: |
          npm run update:testflight -- --non-interactive --message "TestFlight CI update: ${{ github.sha }}"
